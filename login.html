<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Spinning Kartel | Admin Login</title><link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">
<main class="login-card">
  <a class="brand login-brand" href="index.html"><img class="brand-logo" src="logo.webp" alt="Spinning Kartel"><span><strong>SPINNING KARTEL</strong><small>Admin access</small></span></a>
  <p class="eyebrow">MANAGEMENT</p>
  <h1>Admin login</h1>
  <p class="muted">Enter the studio admin password. This device will stay signed in until you log out.</p>
  <form id="loginForm">
    <label>Password<input id="adminPassword" type="password" required autocomplete="current-password" placeholder="Admin password"></label>
    <button class="button full" type="submit">SIGN IN</button>
  </form>
  <p id="loginMessage" class="form-message"></p>
  <a class="back-link" href="index.html">← Back to public site</a>
</main>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
